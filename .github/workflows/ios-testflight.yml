name: Ship iPhone app to TestFlight

# Builds the Brain Dump iPhone app on GitHub's Mac, signs it with your Apple account and
# uploads it to TestFlight. No Mac needed. One-time setup: docs/IOS_APP.md.
#
# Repository secrets:  ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's contents), APPLE_TEAM_ID
# Repository variables: BRAIN_DUMP_SERVER (your Render address), IOS_BUNDLE_ID (optional)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**']

jobs:
  ship:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SERVER: ${{ vars.BRAIN_DUMP_SERVER }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
    steps:
      - name: Check the one-time setup
        id: ready
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8" ] && missing="$missing ASC_KEY_P8"
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$SERVER" ] && missing="$missing BRAIN_DUMP_SERVER(variable)"
          if [ -n "$missing" ]; then
            echo "::notice::TestFlight isn't set up yet (missing:$missing). See docs/IOS_APP.md — nothing was built."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'yes'

      - name: Prepare
        if: steps.ready.outputs.go == 'yes'
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest"
          xcodebuild -version
          brew install xcodegen
          cd ios && xcodegen generate
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
          echo "BUNDLE=${BUNDLE_ID:-com.$owner.braindump}" >> "$GITHUB_ENV"
          echo "BUILD=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - name: Build and sign
        if: steps.ready.outputs.go == 'yes'
        run: |
          cd ios
          xcodebuild -project BrainDump.xcodeproj -scheme BrainDump -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/BrainDump.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" BD_TEAM_ID="$TEAM_ID" BD_BUNDLE_ID="$BUNDLE" BD_APP_GROUP="group.$BUNDLE" \
            BRAIN_DUMP_SERVER="$SERVER" CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGN_STYLE=Automatic | tail -60
          exit ${PIPESTATUS[0]}

      - name: Upload to TestFlight
        if: steps.ready.outputs.go == 'yes'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/BrainDump.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -40
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            echo "::error::Upload failed. If it says there's no app record: create the app in App Store Connect with bundle ID $BUNDLE (docs/IOS_APP.md step 3), then run this again."
          else
            echo "::notice::Uploaded build $BUILD ($BUNDLE). It appears in TestFlight after Apple processes it (usually 10–30 minutes)."
          fi
          exit $status

      - name: Clean up keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
