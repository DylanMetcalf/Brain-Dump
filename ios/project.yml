# Brain Dump for iPhone — generate the Xcode project with XcodeGen:
#   brew install xcodegen && cd ios && xcodegen generate && open BrainDump.xcodeproj
# Set BRAIN_DUMP_SERVER in Config.xcconfig to your Render address first.
name: BrainDump
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: $(BD_TEAM_ID)
targets:
  BrainDump:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BD_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: BrainDump
      - path: Shared
    resources:
      - path: BrainDump/Assets.xcassets
    info:
      path: BrainDump/Info.plist
      properties:
        CFBundleDisplayName: Brain Dump
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: { UIColorName: LaunchBackground }
        UIUserInterfaceStyle: Light
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        BDServerURL: $(BRAIN_DUMP_SERVER)
        BDAppGroup: $(BD_APP_GROUP)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: app.braindump
            CFBundleURLSchemes: [braindump]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.braindump.refresh]
        NSCalendarsFullAccessUsageDescription: Brain Dump finds, adds, moves and cancels your appointments when you ask.
        NSCalendarsWriteOnlyAccessUsageDescription: Brain Dump adds events you ask for to your calendar.
        NSRemindersFullAccessUsageDescription: Brain Dump puts your reminders in the Reminders app and ticks them off when you’re done.
        NSContactsUsageDescription: Brain Dump finds people’s numbers on your phone when you ask it to message or call them. Your contacts stay on your phone.
        NSMicrophoneUsageDescription: Brain Dump listens only after you tap Talk or ask Siri.
        NSSpeechRecognitionUsageDescription: Brain Dump turns what you say into text so it can help.
        NSAlarmKitUsageDescription: Brain Dump sets the alarms and timers you ask for.
        NSUserActivityTypes: [app.braindump.talk]
    entitlements:
      path: BrainDump/BrainDump.entitlements
      properties:
        com.apple.security.application-groups: [$(BD_APP_GROUP)]
    dependencies:
      - target: BrainDumpWidgets
  BrainDumpWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BD_BUNDLE_ID).widgets
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Brain Dump
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BDAppGroup: $(BD_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [$(BD_APP_GROUP)]
schemes:
  BrainDump:
    build:
      targets:
        BrainDump: all
        BrainDumpWidgets: all
