# Render blueprint: New → Blueprint → choose this repository.
# The disk keeps your encrypted data (and notification keys) safe between deploys.
services:
  - type: web
    name: brain-dump
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BRAIN_DUMP_KEY
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
